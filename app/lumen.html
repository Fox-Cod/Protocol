<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'" />
<title>Protocol — Lumen</title>
<style>
	:root{
		--ser:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
		--sans:'Inter','Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
		--app-bg:rgba(9,9,14,.90); --surface:rgba(17,17,25,.80); --surface2:rgba(12,12,19,.74);
		--card:rgba(22,22,31,.72); --ink:#f2f0f8; --ink2:#cbc9d8; --muted:#918fa4; --faint:#65637c;
		--line:rgba(255,255,255,.07); --accent:#7c74ff; --accent-soft:rgba(124,116,255,.18); --accent-ink:#bcb7ff;
		--chip:rgba(255,255,255,.07); --danger:#e0554e; --ok:#4ec98a;
	}
	:root[data-theme="light"]{
		--app-bg:rgba(246,245,241,.88); --surface:rgba(255,255,255,.90); --surface2:rgba(251,250,247,.82);
		--card:rgba(255,255,255,.92); --ink:#191922; --ink2:#4b4b56; --muted:#75747f; --faint:#a7a6b2;
		--line:#e7e4dd; --accent:#5b53ff; --accent-soft:#ecebff; --accent-ink:#4b45d6;
		--chip:#f1efe9; --danger:#c0392b; --ok:#22a06b;
	}
	*{box-sizing:border-box}
	html,body{margin:0;height:100%;background:transparent;font-family:var(--sans);color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none}
	#root{height:100%}
	button{font-family:inherit;color:inherit}
	.app{height:100%;display:flex;flex-direction:column;background:var(--app-bg);overflow:hidden;border-radius:14px;border:1px solid var(--line);backdrop-filter:blur(2px)}
	.app.focusmode{border-color:#3b82f6;box-shadow:0 0 0 1px #3b82f6}   /* только рамка, без свечения */
	.chatwrap{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}
	.aiswitch{display:flex;gap:10px;margin-bottom:14px}
	.aitab{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink2);transition:all .15s}
	.aitab div{display:flex;flex-direction:column;gap:3px}
	.aitab b{font:700 13px/1 var(--sans);color:var(--ink)}
	.aitab span{font:500 10.5px/1.2 var(--sans);color:var(--muted)}
	.aitab:hover{border-color:var(--accent)}
	.aitab.on.cls{border-color:#4ec98a;background:rgba(78,201,138,.12)}
	.aitab.on.law{border-color:#a78bfa;background:rgba(167,139,250,.14)}
	.chatscroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px}
	.chatempty{margin:auto;text-align:center;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px}
	.aiempty{margin:auto;max-width:560px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:18px 6px}
	.aie-ic{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
	.aie-t{font:800 17px/1.3 var(--sans);color:var(--ink)}
	.aie-s{font:500 12.5px/1.5 var(--sans);color:var(--muted);max-width:440px}
	.aie-ex{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:6px 0 4px}
	.aie-ex button{border:1px solid var(--line);background:var(--chip);color:var(--ink2);border-radius:999px;padding:7px 12px;font:600 12px/1 var(--sans);cursor:pointer;transition:border-color var(--fast) var(--ease),color var(--fast) var(--ease)}
	.aie-ex button:hover{border-color:var(--accent);color:var(--ink)}
	.aie-tips{display:flex;flex-direction:column;gap:6px;width:100%;margin-top:6px}
	.aie-tip{display:flex;align-items:flex-start;gap:9px;text-align:left;font:500 12px/1.5 var(--sans);color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
	.aie-tip .k{flex:none;font:800 9px/1.9 var(--sans);letter-spacing:.6px;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);border-radius:5px;padding:0 6px;margin-top:1px}
	.aidisc{font:500 10.5px/1.4 var(--sans);color:var(--faint);text-align:center;padding:7px 4px 0}
	.msg{display:flex}.msg.user{justify-content:flex-end}
	.bub{max-width:80%;padding:10px 13px;border-radius:14px;font-size:12px;line-height:1.55;white-space:pre-wrap}
	.msg.user .bub{background:var(--accent);color:#fff;border-bottom-right-radius:5px}
	.msg.ai .bub{background:var(--card);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:5px}
	.bub.typing{color:var(--muted);font-style:italic}
	.chatbar{display:flex;gap:10px;align-items:flex-end;padding-top:12px;border-top:1px solid var(--line);margin-top:6px}
	.chatin{flex:1;resize:none;min-height:44px;max-height:140px;background:var(--chip);border:1.5px solid var(--line);border-radius:12px;color:var(--ink);font:500 13px/1.5 var(--sans);padding:11px 13px;outline:none}
	.chatin:focus{border-color:var(--accent)}
	.chatsend{width:44px;height:44px;flex-shrink:0;border:none;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
	.chatsend[disabled]{opacity:.4;cursor:default}

	.top{-webkit-app-region:drag;display:flex;align-items:center;gap:11px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0;z-index:3}
	.brand{display:flex;align-items:center;gap:9px;flex-shrink:0;-webkit-app-region:no-drag;cursor:pointer}
	.logo{width:31px;height:31px;border-radius:10px;object-fit:cover;box-shadow:0 4px 12px rgba(91,83,255,.35)}
	.wordmark{font-weight:800;font-size:15px;letter-spacing:-.3px}
	.cmd{-webkit-app-region:no-drag;flex:1;max-width:460px;margin:0 auto;display:flex;align-items:center;gap:9px;background:var(--chip);border:1.5px solid var(--line);border-radius:13px;padding:10px 13px;transition:all .18s}
	.cmd.on{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
	.cmd input{flex:1;border:none;background:none;outline:none;font:500 13px/1 var(--sans);color:var(--ink);-webkit-user-select:text;user-select:text}
	.cmd input::placeholder{color:var(--faint)}
	.topright{-webkit-app-region:no-drag;display:flex;align-items:center;gap:8px;flex-shrink:0}
	.server{height:38px;position:relative;display:flex;align-items:center;gap:8px;background:var(--surface2);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font:600 12px/1 var(--sans);color:var(--ink2);cursor:pointer;transition:all .15s}
	.server:hover{border-color:var(--accent);color:var(--ink)}
	.sdot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(78,201,138,.18)}
	.iconbtn{-webkit-app-region:no-drag;width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
	.iconbtn:hover{border-color:var(--accent);color:var(--ink)}
	.iconbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
	.wcx:hover{background:var(--danger);border-color:var(--danger);color:#fff}

	.srvmenu{position:absolute;top:44px;right:0;width:210px;max-height:320px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.35);padding:6px;z-index:20;backdrop-filter:blur(8px)}
	.srvitem{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;font:600 12.5px/1 var(--sans);color:var(--ink2);cursor:pointer}
	.srvitem:hover{background:var(--chip)}
	.srvitem.on{background:var(--accent-soft);color:var(--accent-ink)}
	.srvitem .lock{margin-left:auto;font-size:11px;opacity:.6}

	.body{flex:1;display:flex;min-height:0}
	.nav{width:194px;flex-shrink:0;padding:12px 12px 0;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);background:var(--surface2);overflow-y:auto}
	/* Отступ сверху вынесен в margin: padding рисуется фоном, и при наведении
	   над текстом появлялась пустая полоса высотой 13px. Внешний отступ
	   разделяет группы так же, но в подсветку не попадает. */
	.navgrp{position:relative;display:flex;align-items:center;gap:7px;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--faint);padding:6px 12px;margin-top:9px;width:100%;background:none;border:none;text-align:left}
	.navgrp:first-child{margin-top:2px}
	.navgrp.btn{cursor:pointer;border-radius:9px}
	.navgrp.btn:hover{color:var(--muted);background:var(--chip)}
	.navgrp .gc{color:var(--faint);font-weight:800;opacity:.75}
	.navgrp .chev{position:absolute;right:10px;top:50%;transform:translateY(-50%);transition:transform .16s}
	.navgrp.clp .chev{transform:translateY(-50%) rotate(-90deg)}
	.navitem{position:relative;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;font:600 12.5px/1.2 var(--sans);color:var(--ink2);cursor:pointer;transition:background .13s,color .13s;text-align:left;border:none;background:none;width:100%}
	.navitem:hover{background:var(--chip);color:var(--ink)}
	.navitem.active{background:var(--accent-soft);color:var(--accent-ink)}
	.navitem.active::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--accent)}
	.cdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
	.navttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
	.navfill{flex:1;min-height:12px}
	.dbcard{display:flex;align-items:center;gap:7px;width:100%;margin:6px 0 10px;padding:6px 9px;
		background:none;border:1px solid var(--line);border-radius:9px;cursor:pointer;text-align:left;
		color:var(--ink2);font:700 10.5px/1 var(--sans);transition:background .13s,color .13s,border-color .13s}
	.dbcard:hover{background:var(--chip);color:var(--ink)}
	.dbcard.on{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
	.dbcard .t{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
	.dbcard .d{margin-left:auto;font:600 9.5px/1 var(--mono,var(--sans));color:var(--faint);white-space:nowrap;letter-spacing:.2px}
	.dbcard .pt{width:5px;height:5px;border-radius:50%;background:var(--ok);flex-shrink:0;
		box-shadow:0 0 0 0 rgba(78,201,138,.6);animation:ptPulse 1.9s var(--ease,ease) infinite}
	@keyframes ptPulse{70%{box-shadow:0 0 0 5px rgba(78,201,138,0)}100%{box-shadow:0 0 0 0 rgba(78,201,138,0)}}

	.main{flex:1;min-width:0;overflow-y:auto;padding:22px 26px}
	.crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);font-weight:600;margin-bottom:14px;flex-wrap:wrap}
	.crumbs .clink{cursor:pointer}.crumbs .clink:hover{color:var(--muted)}
	.crumbs .cur{color:var(--muted)}
	.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
	h1.ttl{margin:0;font-family:var(--ser);font-size:30px;font-weight:700;letter-spacing:-.4px;line-height:1.06;color:var(--ink)}
	.accrule{width:44px;height:3px;border-radius:2px;background:var(--accent);margin:12px 0 10px}
	/* ── главная ── */
	.home{max-width:980px}
	.hhero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:4px 0 18px}
	.hkick{display:inline-flex;align-items:center;gap:7px;font:800 10px/1 var(--sans);letter-spacing:1.2px;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:5px 10px;margin-bottom:12px}
	.hkick .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
	.hhero .ttl{margin-bottom:8px}
	.hask{display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 14px 0 15px;border:none;border-radius:12px;background:var(--accent);color:#fff;font:700 13px/1 var(--sans);cursor:pointer;transition:filter var(--fast) var(--ease)}
	.hask:hover{filter:brightness(1.12)}
	.hask kbd,.hq kbd{font:700 10px/1 var(--mono,Consolas,monospace);border-radius:5px;padding:3px 6px}
	.hask kbd{background:rgba(255,255,255,.2);color:#fff}
	.hquick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:26px}
	.hq{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:11px;row-gap:3px;align-items:center;text-align:left;
		background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;cursor:pointer;color:var(--ink);transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease)}
	.hq:hover{border-color:var(--accent);background:var(--chip)}
	.hqi{grid-row:1 / 3;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
	.hqt{font:800 13px/1.2 var(--sans);display:flex;align-items:center;gap:6px}
	.hqd{font:500 11px/1.35 var(--sans);color:var(--muted)}
	.hq kbd{margin-left:auto;background:var(--chip);color:var(--muted);border:1px solid var(--line)}
	.hsec{display:flex;align-items:center;gap:8px;font:800 10px/1 var(--sans);letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
	.hsec span{font-weight:700;letter-spacing:0;color:var(--faint);opacity:.8}
	.hmain{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:26px}
	.hm{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 15px 13px 18px;cursor:pointer;color:var(--ink);transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease)}
	.hm::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
	.hm:hover{border-color:var(--c);background:var(--chip)}
	.hms{font:800 11px/1 var(--sans);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:6px;padding:4px 7px;margin-bottom:6px}
	.hmt{font:800 14px/1.25 var(--sans)}
	.hmh{font:500 11.5px/1.35 var(--sans);color:var(--muted)}
	.hmn{font:600 10.5px/1 var(--sans);color:var(--faint);margin-top:8px}
	.hlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:6px;margin-bottom:24px}
	.hl{display:flex;align-items:center;gap:10px;min-width:0;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink);transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease)}
	.hl:hover{border-color:var(--accent);background:var(--chip)}
	.hls{flex:none;min-width:38px;text-align:center;font:800 10px/1 var(--sans);border-radius:6px;padding:5px 5px}
	.hlt{flex:1;min-width:0;font:600 12.5px/1.3 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
	.hln{flex:none;font:600 10.5px/1 var(--sans);color:var(--faint)}
	.sub{margin:0;font-size:13px;color:var(--muted)}

	/* Список статей — это указатель, а не чтение. Кодекс на 62 статьи прежней
	   вёрсткой давал больше 10 000 px прокрутки; сейчас вдвое меньше. Сама
	   статья открывается по клику, и вот там уже крупно и просторно. */
	.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:11px;
		padding:8px 11px 8px 14px;margin-bottom:5px;cursor:pointer;overflow:hidden;text-align:left;width:100%;display:block;
		transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease)}
	.card:hover{border-color:var(--accent);background:var(--chip)}
	.spine{position:absolute;left:0;top:0;bottom:0;width:3px}
	.cardhd{display:flex;align-items:baseline;gap:8px;min-width:0}
	/* Двухрядная шапка осталась у собственных заметок в избранном: там
	   заголовок с текстом, а не статья, и в одну строку он не ложится. */
	.cardtop{display:flex;align-items:center;gap:8px;margin-bottom:7px}
	.cat{font:700 9.5px/1 var(--sans);letter-spacing:.2px;border-radius:5px;padding:3px 6px;flex-shrink:0}
	.artno{font:700 10.5px/1 var(--sans);color:var(--faint);flex-shrink:0;white-space:nowrap}
	.artno:before{content:"ст. "}
	.card h3{margin:0;font-family:var(--ser);font-size:13.5px;font-weight:700;letter-spacing:-.1px;
		color:var(--ink);line-height:1.35;flex:1;min-width:0;
		overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
	/* Одна строка вместо трёх плашек: остальное человек прочитает, открыв статью */
	.cardprev{margin:2px 0 0;font:500 11px/1.4 var(--sans);color:var(--muted);
		overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
	/* Без заголовка предпросмотр занимает его место: карточка в одну строку */
	.cardprev.solo{margin:0;flex:1;min-width:0;font-size:11.5px;color:var(--ink2)}
	.cardgap{flex:1}
	.card p{margin:0 0 12px;font-size:12.5px;line-height:1.55;color:var(--muted)}
	.tags{display:flex;flex-wrap:wrap;gap:7px}
	.tag{display:inline-flex;align-items:center;gap:5px;font:600 11px/1.3 var(--sans);border-radius:8px;padding:6px 10px;color:var(--ink2);background:var(--chip)}
	.tag.pen{color:#e0a24a;background:rgba(224,162,74,.14)}
	.bmc{margin-left:auto;width:22px;height:22px;border-radius:6px;border:none;background:none;color:var(--faint);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:center}
	.card:hover .bmc{background:var(--chip)}
	.bmc.on{color:#e0b24a;background:rgba(224,178,74,.16)}

	.rhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
	.bm{width:34px;height:34px;border-radius:10px;border:none;background:var(--chip);color:var(--faint);cursor:pointer;display:flex;align-items:center;justify-content:center}
	.bm.on{color:#e0b24a}
	.rpart{margin:0 0 16px}
	.rpart .pn{font:800 11px/1 var(--sans);letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
	.rpart .pt{font-size:14px;line-height:1.65;color:var(--ink2);white-space:pre-wrap}
	.empty{padding:40px 20px;text-align:center;color:var(--faint)}
	.empty h2{font-family:var(--ser);color:var(--muted);font-weight:700;margin:0 0 6px}

	/* editing */
	.edwrap{background:var(--card);border:1px dashed var(--accent);border-radius:14px;padding:14px;margin-bottom:14px}
	.edrow{display:flex;gap:8px;margin-bottom:8px}
	.edin,.edta{width:100%;background:var(--chip);border:1px solid var(--line);border-radius:9px;color:var(--ink);font:500 13px/1.5 var(--sans);padding:8px 10px;outline:none;resize:vertical}
	.edin:focus,.edta:focus{border-color:var(--accent)}
	.edlbl{width:130px;flex-shrink:0}
	.smbtn{border:1px solid var(--line);background:var(--chip);color:var(--ink2);border-radius:8px;padding:7px 10px;font:700 11px/1 var(--sans);cursor:pointer}
	.smbtn.dng{color:#fff;background:var(--danger);border-color:var(--danger)}
	.smbtn.pri{color:#fff;background:var(--accent);border-color:var(--accent)}
	.editflag{display:inline-block;font:700 9px/1 var(--sans);letter-spacing:.5px;color:var(--accent-ink);background:var(--accent-soft);border-radius:5px;padding:3px 6px;margin-left:6px}

	/* footer */
	.foot{flex-shrink:0;display:flex;flex-direction:column;gap:0;background:var(--surface);border-top:1px solid var(--line)}
	.footrow{display:flex;align-items:center;gap:12px;padding:8px 14px}
	.fmeta{display:flex;align-items:center;gap:14px}

	.aurun{position:sticky;bottom:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;background:#17161f;border:1px solid var(--line);border-radius:13px;padding:13px 14px;box-shadow:0 -10px 24px -12px rgba(0,0,0,.6)}
	:root[data-theme="light"] .aurun{background:#fff;box-shadow:0 -10px 24px -14px rgba(0,0,0,.25)}
	.aurt{flex:1;min-width:240px;display:flex;flex-direction:column;gap:4px}
	.aurt b{font:800 13.5px/1.3 var(--sans);color:var(--ink)}
	.aurt span{font:500 11px/1.45 var(--sans);color:var(--muted)}
	.aurbtn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border:none;border-radius:11px;background:var(--accent);color:#fff;font:700 13px/1 var(--sans);cursor:pointer}
	.aurbtn:hover{filter:brightness(1.1)}
	.aurbtn[disabled]{opacity:.45;cursor:default;filter:none}
	.aurbtn.arm{background:#e0a24a;color:#1b1406}
	.aupt .austop{margin-left:auto}
	.auprog{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 15px;margin-bottom:18px}
	.aupt{display:flex;align-items:center;gap:9px;font:700 13px/1.2 var(--sans);color:var(--ink);margin-bottom:10px}
	.aupb{height:4px;border-radius:99px;background:var(--chip);overflow:hidden;margin-bottom:12px}
	.aupb span{display:block;height:100%;background:var(--accent);transition:width .4s var(--ease)}
	.aupl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:5px 14px}
	.aupr{display:flex;align-items:center;gap:8px;font:500 11.5px/1.3 var(--sans);color:var(--muted)}
	.aupr .ico{flex:none;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--chip)}
	.aupr b{font-weight:800;color:var(--ink2);min-width:44px}
	.aupr.ok .ico{background:rgba(78,201,138,.18);color:#4ec98a}
	.aupr.fail .ico{background:rgba(224,85,78,.18);color:#e0554e}
	.aupr.fail .st{color:#f0938d}
	.aupr.run b,.aupr.run .st{color:var(--ink)}
	.auspin{width:13px;height:13px;border-radius:50%;border:2px solid var(--chip);border-top-color:var(--accent);animation:auspin .8s linear infinite;flex:none}
	@keyframes auspin{to{transform:rotate(360deg)}}
	.auspin.sm{width:10px;height:10px;border-width:1.5px}
	.aunone{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:13px 15px;margin-bottom:16px}
	.aunone b{font:800 13px/1.3 var(--sans);color:var(--ink)}
	.aunone span{font:500 12px/1.5 var(--sans);color:var(--muted)}
	.ausum{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 18px;margin-bottom:14px}
	.ausc{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:72px;height:72px;border-radius:16px;background:color-mix(in srgb,var(--sc) 14%,transparent);border:1px solid color-mix(in srgb,var(--sc) 45%,transparent)}
	.ausc b{font:800 26px/1 var(--sans);color:var(--sc)}
	.ausc span{font:700 9px/1 var(--sans);color:var(--faint);margin-top:4px}
	.ausd{flex:1;min-width:220px;display:flex;flex-direction:column;gap:5px}
	.ausd > b{font:800 14px/1.25 var(--sans);color:var(--ink)}
	.ausd > span{font:500 11.5px/1.3 var(--sans);color:var(--muted)}
	.audbarline{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--chip);margin-top:6px;gap:2px}
	.audbarline span{display:block;height:100%}
	.aukpis{display:flex;gap:18px}
	.aukpis div{display:flex;flex-direction:column;align-items:center;gap:4px}
	.aukpis b{font:800 18px/1 var(--sans)}
	.aukpis span{font:700 9.5px/1 var(--sans);letter-spacing:.4px;text-transform:uppercase;color:var(--faint)}
	.audfilters{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
	.audq{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px 5px 3px 12px;color:var(--faint)}
	.audq:focus-within{border-color:var(--accent)}
	.audq input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font:500 13px/1 var(--sans);padding:8px 0}
	.audq button{border:none;background:none;color:var(--faint);cursor:pointer;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center}
	.audchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
	.achip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);color:var(--ink2);border-radius:999px;padding:6px 11px;font:700 11px/1 var(--sans);cursor:pointer}
	.achip:hover{color:var(--ink);border-color:var(--accent)}
	.achip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
	.achip.sev i{width:7px;height:7px;border-radius:50%;background:var(--c)}
	.achip.sev.on{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:var(--c)}
	.asep{width:1px;height:16px;background:var(--line);margin:0 3px}
	.audcount{font:600 11px/1 var(--sans);color:var(--faint);margin:4px 0 10px}
	.af{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px 12px 19px;margin-bottom:10px}
	.af::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
	.aftop{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}
	.asev{font:800 9px/1 var(--sans);letter-spacing:.6px;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border-radius:999px;padding:4px 8px}
	.atype{font:700 10.5px/1 var(--sans);color:var(--ink2);background:var(--chip);border-radius:999px;padding:4px 8px}
	.alaw{font:800 10.5px/1 var(--sans);color:var(--faint)}
	.arefs{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
	.aref{font:800 10.5px/1 var(--sans);color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:4px 7px;cursor:pointer;white-space:nowrap}
	.aref:hover{background:var(--accent);color:#fff}
	.aref.bad{color:#ffb3ad;background:rgba(224,85,78,.15);text-decoration:line-through;cursor:default}
	.aref.plain{cursor:default;color:var(--muted);background:var(--chip)}
	.afh{margin:0 0 10px;font:800 15px/1.35 var(--sans);color:var(--ink)}
	.ablk{margin-bottom:8px;border-radius:9px;padding:9px 11px;background:var(--chip)}
	.ablk b{display:block;font:800 9.5px/1 var(--sans);letter-spacing:.6px;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
	.ablk p{margin:0;font:500 12.5px/1.55 var(--sans);color:var(--ink2)}
	.ablk.use b{color:#f3c778}
	.ablk.fix{background:rgba(78,201,138,.08)}
	.ablk.fix b{color:#7fd8a6}
	.admore{margin-top:7px;border:none;background:none;color:var(--accent-ink);font:700 11px/1 var(--sans);cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px}
	.admore:hover{text-decoration:underline}
	.af.done{opacity:.6}
	.af.done .afh{text-decoration:line-through;text-decoration-color:var(--faint)}
	.audacts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
	.aact{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:6px 10px;font:700 10.5px/1 var(--sans);cursor:pointer}
	.aact:hover{color:var(--ink);border-color:var(--accent)}
	.aact.on{background:rgba(78,201,138,.14);border-color:#4ec98a;color:#7fd8a6}
	:root[data-theme="light"] .auderr,:root[data-theme="light"] .aref.bad{color:#b3261e}
	:root[data-theme="light"] .ablk.use b{color:#8a5b06}
	:root[data-theme="light"] .ablk.fix b{color:#1a7a4e}

	/* ── Обновление приложения ─────────────────────────────────────── */
	.uphead{display:flex;align-items:center;gap:12px;padding:2px 0 14px}
	.upver{display:flex;align-items:baseline;gap:8px;font:800 20px/1 var(--sans);color:var(--ink)}
	.upver s{text-decoration:none;font:600 13px/1 var(--sans);color:var(--faint)}
	.upver em{font-style:normal;color:var(--accent-ink)}
	.upmeta{margin-left:auto;text-align:right;font:600 11px/1.4 var(--sans);color:var(--muted)}
	/* Список растёт вместе с окном: ради него окно и открывают. Внутренняя
	   прокрутка остаётся — иначе длинный релиз утащил бы вниз полосу загрузки
	   и строчку «файл скачан», а они должны быть на виду. */
	.updchg{max-height:min(48vh,430px);overflow-y:auto;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:500 12.5px/1.6 var(--sans);color:var(--ink2)}
	.updchg .h{display:block;font:800 12px/1.5 var(--sans);color:var(--ink);margin:9px 0 4px}
	.updchg .h:first-child{margin-top:0}
	.updchg .hr{height:1px;background:var(--line);margin:11px 0;border-radius:1px}
	.updchg .li{display:flex;gap:8px;margin:3px 0}
	.updchg .li .m{flex-shrink:0;width:15px;text-align:center;font-weight:800}
	.updchg .li.add .m{color:#4ec98a}.updchg .li.del .m{color:var(--danger)}
	.updchg .li.fix .m{color:#f0b23c}.updchg .li.chg .m{color:var(--accent-ink)}
	.chgempty{color:var(--faint);font-style:italic}
	.prog{height:7px;border-radius:99px;background:var(--chip);overflow:hidden;margin:12px 0 6px}
	.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#4ec98a);border-radius:99px;transition:width .2s}
	.progtx{display:flex;justify-content:space-between;font:600 11px/1 var(--sans);color:var(--muted)}

	/* ── История запросов к ИИ ─────────────────────────────────────── */
	.histwrap{display:flex;flex-direction:column;gap:7px}
	.histrow{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:all .13s;text-align:left;width:100%;color:inherit}
	.histrow:hover{border-color:var(--accent);transform:translateY(-1px)}
	.histrow .q{flex:1;min-width:0}
	.histrow .q b{display:block;font:700 12.5px/1.35 var(--sans);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
	.histrow .q i{display:block;font:500 11px/1.4 var(--sans);color:var(--muted);font-style:normal;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
	.histrow .meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
	.histrow .tm{font:600 10px/1 var(--sans);color:var(--faint)}
	.histpin{border:none;background:transparent;color:var(--faint);cursor:pointer;padding:2px;border-radius:5px;line-height:0}
	.histpin.on,.histpin:hover{color:var(--accent-ink)}
	.histrow.on{border-color:var(--accent);background:var(--accent-soft)}
	.histrow.on .q b{color:var(--accent-ink)}

	/* ── Сравнение серверов ────────────────────────────────────────── */
	.cmpbar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
	.cmpstat{flex:1;min-width:88px;background:var(--chip);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
	.cmpstat b{display:block;font:800 17px/1 var(--sans);color:var(--ink)}
	.cmpstat i{display:block;font:600 10px/1 var(--sans);color:var(--muted);font-style:normal;margin-top:5px;text-transform:uppercase;letter-spacing:.3px}

	/* ── Офлайн-ответ ИИ (поиск без модели) ────────────────────────── */
	.offbox{border:1px dashed var(--line);border-radius:13px;padding:12px 14px;background:var(--surface2)}
	.offtop{display:flex;align-items:center;gap:8px;font:700 11.5px/1 var(--sans);color:var(--muted);margin-bottom:10px}
	.offart{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:6px;cursor:pointer;color:inherit;transition:all .13s}
	.offart:hover{border-color:var(--accent);transform:translateY(-1px)}
	.offart b{display:block;font:700 12px/1.3 var(--sans);color:var(--accent-ink)}
	.offart i{display:block;font:500 11.5px/1.4 var(--sans);color:var(--ink2);font-style:normal;margin-top:3px}

	/* ── Избранное (4.2.0) ─────────────────────────────────────────── */
	.favp{max-width:900px}
	.favp .sub{margin:8px 0 16px}
	.ftools{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
	.fadd,.ffind{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 5px 5px 12px;transition:border-color var(--fast) var(--ease)}
	.fadd:focus-within,.ffind:focus-within{border-color:var(--accent)}
	.fadd .fi,.ffind > svg{color:var(--faint);flex:none}
	.fadd input,.ffind input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font:500 13px/1 var(--sans);padding:8px 0}
	.ffind{padding:3px 5px 3px 12px}
	.ffind button{border:none;background:none;color:var(--faint);cursor:pointer;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center}
	.ffind button:hover{background:var(--chip);color:var(--ink)}
	.fsec{display:flex;align-items:center;gap:8px;font:800 10px/1 var(--sans);letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin:0 0 9px}
	.fsec > span{letter-spacing:0;opacity:.8}
	.fsec .sh{font:800 10px/1 var(--sans);letter-spacing:.3px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:6px;padding:4px 7px;text-transform:none}
	.fnotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:24px}
	.fnote{position:relative;display:flex;flex-direction:column;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px 10px 15px;overflow:hidden}
	.fnote::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
	.fk{font:800 8.5px/1 var(--sans);letter-spacing:.8px;text-transform:uppercase;color:var(--accent-ink)}
	.ft{font:700 13.5px/1.35 var(--sans);color:var(--ink);overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
	.fx{font:500 12px/1.5 var(--sans);color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;-webkit-user-select:text;user-select:text}
	.facts{display:flex;gap:6px;margin-top:auto;padding-top:6px}
	.facts button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--chip);color:var(--ink2);border-radius:8px;padding:6px 9px;font:700 10.5px/1 var(--sans);cursor:pointer}
	.facts button:first-child{flex:1;justify-content:center}
	.facts button:hover{border-color:var(--accent);color:var(--ink)}
	.facts button.del:hover{border-color:var(--danger);color:var(--danger)}
	.fgrp{margin-bottom:22px}
	.flist{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
	.flist::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
	.frow{display:flex;align-items:center;gap:11px;padding:10px 10px 10px 15px;border-top:1px solid var(--line);cursor:pointer;transition:background var(--fast) var(--ease)}
	.frow:first-child{border-top:none}
	.frow:hover{background:var(--chip)}
	.frow .no{flex:none;min-width:64px;font:800 11px/1 var(--sans);color:var(--c);white-space:nowrap}
	.frow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
	.frow .t{font:700 13px/1.3 var(--sans);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
	.frow .p{font:500 11.5px/1.35 var(--sans);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
	.frow .fa{flex:none;width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:none;color:var(--faint);cursor:pointer;display:flex;align-items:center;justify-content:center}
	.frow .fa:hover{border-color:var(--line);background:var(--card);color:var(--ink)}
	.frow .fa.star{color:#f0b23c}
	.frow .fa.star:hover{color:var(--danger)}
	.frow.gone{cursor:default}
	.frow.gone .t{color:var(--faint);font-style:italic}
	.fnone{font:500 12.5px/1.5 var(--sans);color:var(--muted);padding:8px 2px}
	.fempty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 10px}
	.fei{width:52px;height:52px;border-radius:16px;background:rgba(240,178,60,.14);color:#f0b23c;display:flex;align-items:center;justify-content:center}
	.fet{font:800 16px/1.3 var(--sans);color:var(--ink)}
	.fes{display:flex;flex-direction:column;gap:7px;margin-top:4px;max-width:430px}
	.fes div{display:flex;align-items:flex-start;gap:10px;text-align:left;font:500 12.5px/1.5 var(--sans);color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
	.fes b{flex:none;width:18px;display:flex;justify-content:center;color:var(--accent-ink);padding-top:2px}

	/* ── Настройки: сводка состояния и разделы ─────────────────────── */
	.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:16px}
	.setgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
	.setcard.act{display:flex;flex-direction:column;gap:0}
	.setcard.act i{text-transform:none;letter-spacing:0;font-size:10.5px;line-height:1.35;flex:1}
	.setcard.act .mbtn{align-self:flex-start;margin-top:9px}
	@media (max-width:760px){.setgrid.three{grid-template-columns:minmax(0,1fr)}}
	.setcard{background:var(--chip);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
	.setcard b{display:block;font:800 13px/1.2 var(--sans);color:var(--ink)}
	.setcard i{display:block;font:600 9.5px/1 var(--sans);color:var(--faint);font-style:normal;margin-top:5px;text-transform:uppercase;letter-spacing:.4px}
	.setcard.ok b{color:#7fd8a6}.setcard.warn b{color:#f0b23c}.setcard.off b{color:var(--muted)}
	.sechd{display:flex;align-items:center;gap:7px;font:800 10px/1 var(--sans);letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin:16px 0 8px}
	.sechd:first-child{margin-top:0}
	.sechd .ln{flex:1;height:1px;background:var(--line)}
	.sechd.danger{color:var(--danger)}
	.setrow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
	/* Объяснение счётчика: длинный текст в настройках, поэтому кегль мельче
	   основного, а границы блока мягче — это справка, а не элемент управления. */
	.statsx{background:var(--chip);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:2px 0 12px;
		animation:riseIn var(--mid) var(--ease) both}
	.statsx b{display:block;font:800 9.5px/1 var(--sans);letter-spacing:.6px;text-transform:uppercase;
		color:var(--accent-ink);margin:14px 0 5px}
	.statsx b:first-child{margin-top:0}
	.statsx p{font:500 11.5px/1.55 var(--sans);color:var(--ink2);margin:0 0 6px}
	.statsx p.fin{color:var(--muted);border-top:1px solid var(--line);padding-top:9px;margin-top:12px}
	.statsx s{text-decoration:none;font:700 11px/1 ui-monospace,Consolas,monospace;color:var(--accent-ink);
		background:var(--accent-soft);border-radius:4px;padding:2px 4px}
	.statsx .mono{font:500 11px/1.5 ui-monospace,Consolas,monospace;color:var(--muted);word-break:break-all}
	.statsx pre{font:500 11px/1.55 ui-monospace,Consolas,monospace;color:var(--ink2);background:var(--card);
		border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:0 0 7px;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
	.statsx .cmphead{margin:8px 0 0}
	.sethint{font:500 10.5px/1.45 var(--sans);color:var(--muted);margin:0 0 10px}

	/* ══ Движение ═══════════════════════════════════════════════════
	   Одна кривая на всё приложение (--ease) и три длительности. Разнобой
	   в таймингах читается как неряшливость даже когда каждая анимация
	   по отдельности выглядит нормально. Всё это гасится системной
	   настройкой «уменьшить движение» — правило в конце файла. */
	:root{--ease:cubic-bezier(.4,0,.2,1);--fast:.13s;--mid:.22s;--slow:.34s}

	@keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
	@keyframes fadeIn{from{opacity:0}to{opacity:1}}
	@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
	@keyframes slideRight{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
	@keyframes bubbleIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}

	/* Смена раздела: содержимое въезжает, а не подменяется рывком. */
	.main > div,.main > .chatwrap,.main > .aishell{animation:riseIn var(--mid) var(--ease) both}
	.modalbg{animation:fadeIn var(--fast) ease both}
	.modal{animation:popIn var(--mid) var(--ease) both}
	.msg{animation:bubbleIn var(--mid) var(--ease) both}
	.toast{animation:riseIn var(--mid) var(--ease) both}
	.dbrow,.csrow,.histrow{animation:slideRight var(--fast) var(--ease) both}
	.dbtile,.card,.setcard,.cmpstat{animation:popIn var(--mid) var(--ease) both}
	.ans > *{animation:riseIn var(--mid) var(--ease) both}
	.ans > *:nth-child(2){animation-delay:.05s}
	.ans > *:nth-child(3){animation-delay:.1s}
	.ans > *:nth-child(4){animation-delay:.15s}
	.audpick,.srvmenu,.fontmenu,.copymenu{animation:popIn var(--fast) var(--ease) both}

	/* Отклик на нажатие: короткое «проседание» вместо мгновенной смены цвета. */
	button{transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease),
		color var(--fast) var(--ease),transform var(--fast) var(--ease),opacity var(--fast) var(--ease)}
	button:active:not([disabled]){transform:scale(.965)}
	.navitem,.dbact,.aitab,.mbtn,.footbtn,.dbtab,.audrun,.notebtn,.chatsend{will-change:transform}
	.navitem{transition:background var(--fast) var(--ease),color var(--fast) var(--ease),padding-left var(--mid) var(--ease)}
	.navitem:hover{padding-left:15px}
	.footbtn:active:not([disabled]){transform:scale(.9)}
	.chatsend{transition:transform var(--fast) var(--ease),opacity var(--fast) var(--ease),background var(--fast) var(--ease)}
	.chatsend:active:not([disabled]){transform:scale(.9) rotate(-8deg)}
	.bmc,.histpin,.csdel{transition:color var(--fast) var(--ease),transform var(--fast) var(--ease)}
	.bmc:active,.histpin:active,.csdel:active{transform:scale(.85)}
	.spine{transition:height var(--mid) var(--ease)}
	input,textarea{transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease)}
	.sw{transition:background var(--mid) var(--ease),border-color var(--mid) var(--ease)}
	.sw span{transition:transform var(--mid) var(--ease)}
	.tag,.cat,.artno{transition:background var(--fast) var(--ease),color var(--fast) var(--ease)}

	/* ── Вкладка «База данных» ─────────────────────────────────────── */
	.dbhero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:14px;
		background:linear-gradient(135deg,rgba(124,116,255,.16),rgba(78,201,138,.09) 60%,transparent)}
	.dbhero:before{content:'';position:absolute;inset:-40% -10% auto auto;width:220px;height:220px;border-radius:50%;
		background:radial-gradient(circle,rgba(124,116,255,.22),transparent 70%);pointer-events:none}
	.dbhero .top{display:flex;align-items:flex-start;gap:12px;position:relative}
	.dbhero .big{font:800 30px/1 var(--sans);color:var(--ink);letter-spacing:-.5px}
	.dbhero .cap{font:600 10px/1 var(--sans);letter-spacing:.6px;text-transform:uppercase;color:var(--faint);margin-top:7px}
	.dbpill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font:800 10px/1 var(--sans);letter-spacing:.3px;text-transform:uppercase}
	.dbpill.ok{background:rgba(78,201,138,.16);color:#7fd8a6;border:1px solid rgba(78,201,138,.4)}
	.dbpill.stale{background:rgba(240,178,60,.15);color:#f0b23c;border:1px solid rgba(240,178,60,.42)}
	.dbpill.busy{background:var(--accent-soft);color:var(--accent-ink);border:1px solid rgba(124,116,255,.4)}
	.dbpill.err{background:rgba(224,85,78,.14);color:#ef8a84;border:1px solid rgba(224,85,78,.4)}
	.dbacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;position:relative}
	.dbbar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:12px;position:relative}
	.dbbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#4ec98a);transition:width .25s}

	.dbmatrix{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:7px;margin-bottom:16px}
	.dbtile{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;cursor:pointer;color:inherit;
		transition:transform .16s cubic-bezier(.4,0,.2,1),border-color .16s,background .16s}
	.dbtile:hover{transform:translateY(-2px);border-color:var(--accent)}
	.dbtile.on{border-color:var(--accent);background:var(--accent-soft)}
	.dbtile .nm{display:flex;align-items:center;gap:6px;font:700 11.5px/1.2 var(--sans);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
	.dbtile .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
	.dbtile .mt{display:block;font:600 9.5px/1.3 var(--sans);color:var(--faint);margin-top:5px}
	.dbtile .cur{position:absolute;top:7px;right:7px;font:800 8px/1 var(--sans);letter-spacing:.3px;color:var(--accent-ink)}

	/* ── Сверка серверов: выбор нескольких баз и разбор расхождений ── */
	.srvpick{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
	.srvchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--chip);
		color:var(--muted);border-radius:8px;padding:5px 9px;font:700 10.5px/1 var(--sans);cursor:pointer;
		transition:background var(--fast) var(--ease),color var(--fast) var(--ease),border-color var(--fast) var(--ease)}
	.srvchip:hover{color:var(--ink)}
	.srvchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
	.srvchip.base{background:var(--accent);border-color:var(--accent);color:#fff}
	.srvchip[disabled]{opacity:.35;cursor:default}
	.srvchip .bx{width:11px;height:11px;border-radius:3px;border:1.5px solid currentColor;flex-shrink:0;position:relative}
	.srvchip.on .bx:after,.srvchip.base .bx:after{content:"";position:absolute;left:2px;top:0;width:4px;height:7px;
		border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
	.cmphead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
	.cmplbl{font:800 9.5px/1 var(--sans);letter-spacing:.6px;text-transform:uppercase;color:var(--faint);margin-right:2px}
	.cmprow{display:grid;grid-template-columns:88px 1fr auto;align-items:center;gap:9px;width:100%;text-align:left;
		background:var(--card);border:1px solid var(--line);border-left-width:3px;border-radius:10px;
		padding:7px 10px;margin-bottom:5px;cursor:pointer;color:inherit;
		transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease)}
	.cmprow:hover{border-color:var(--accent)}
	.cmprow.diff{border-left-color:#e0a24a}
	.cmprow.miss{border-left-color:var(--danger)}
	.cmprow.same{border-left-color:var(--ok)}
	.cmprow .no{font:800 11px/1 var(--sans);color:var(--ink)}
	.cmprow .nm{font:600 11.5px/1.35 var(--sans);color:var(--ink2);min-width:0;overflow:hidden;
		text-overflow:ellipsis;white-space:nowrap}
	.cmprow .st{display:flex;gap:3px;flex-shrink:0}
	.cmpdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
	.cmpexp{background:var(--chip);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin:0 0 8px;
		animation:riseIn var(--mid) var(--ease) both}
	.cmpexp .who{display:flex;align-items:center;gap:6px;font:800 11px/1 var(--sans);color:var(--ink);margin:10px 0 6px}
	.cmpexp .who:first-child{margin-top:0}
	.cmpexp .absent{font:600 11px/1 var(--sans);color:var(--danger)}
	.cmplegend{display:flex;gap:12px;flex-wrap:wrap;font:600 10px/1 var(--sans);color:var(--faint);margin:8px 0 12px}
	.cmplegend span{display:inline-flex;align-items:center;gap:5px}
	/* Переключатель разделов вкладки базы. Раньше матрица серверов, разбор
	   изменений, сверка и история лежали одной лентой, и до сверки надо было
	   проехать девятнадцать плиток и весь список правок. Шапка со статусом
	   и кнопками остаётся выше — она нужна в любом разделе. */
	.dbnav{display:flex;gap:4px;margin:14px 0 16px;padding:4px;background:var(--chip);
		border:1px solid var(--line);border-radius:12px;overflow-x:auto}
	.dbnavb{flex:1;min-width:92px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
		border:none;background:none;color:var(--muted);border-radius:9px;padding:8px 10px;
		font:700 11.5px/1 var(--sans);cursor:pointer;white-space:nowrap;
		transition:background var(--fast) var(--ease),color var(--fast) var(--ease)}
	.dbnavb:hover{color:var(--ink);background:var(--card)}
	.dbnavb.on{background:var(--accent);color:#fff}
	.dbnavb .n{font:800 9.5px/1 var(--sans);border-radius:5px;padding:3px 5px;
		background:var(--line);color:var(--faint)}
	.dbnavb.on .n{background:rgba(255,255,255,.25);color:#fff}
	.dbsec{animation:riseIn var(--mid) var(--ease) both}
	.dbsec > .sechd:first-child{margin-top:0}
	@media (max-width:900px){.dbnavb{min-width:0;padding:8px 7px;font-size:10.5px}}
	.dbtabs{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
	.dbtab{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);color:var(--muted);border-radius:9px;
		padding:6px 11px;font:700 11px/1 var(--sans);cursor:pointer;transition:all .15s}
	.dbtab:hover{color:var(--ink);border-color:var(--accent)}
	.dbtab.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
	.dbtab .n{font:800 9.5px/1 var(--sans);opacity:.8}
	.dbtab.add.on{background:rgba(78,201,138,.14);border-color:rgba(78,201,138,.5);color:#7fd8a6}
	.dbtab.del.on{background:rgba(224,85,78,.13);border-color:rgba(224,85,78,.45);color:#ef8a84}

	.dbchg{display:flex;flex-direction:column;gap:6px}
	.dbrow{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-left-width:3px;border-radius:10px;
		padding:8px 11px;cursor:pointer;text-align:left;width:100%;color:inherit;transition:border-color .15s,background .15s,transform .15s}
	.dbrow:hover{transform:translateX(2px);border-color:var(--accent)}
	.dbrow.add{border-left-color:#4ec98a}.dbrow.chg{border-left-color:#f0b23c}.dbrow.del{border-left-color:var(--danger)}
	.dbrow .code{font:800 9.5px/1 var(--sans);padding:4px 6px;border-radius:5px;background:var(--chip);color:var(--muted);flex-shrink:0}
	.dbrow .ti{flex:1;min-width:0;font:600 11.5px/1.35 var(--sans);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
	.dbrow .cv{font:700 10px/1 var(--sans);color:var(--faint);flex-shrink:0}
	.dbdiff{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:2px 0 8px}
	.dbdiff .hd{font:800 9.5px/1 var(--sans);letter-spacing:.4px;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
	.dbdiff .was{color:var(--muted);text-decoration:line-through;opacity:.75}
	.dbdiff .now{color:#8fe8b7}
	.dbdiff p{margin:0 0 9px;font:500 11.5px/1.55 var(--sans);overflow-wrap:anywhere}
	.dbdiff p:last-child{margin-bottom:0}

	.dbtimeline{display:flex;flex-direction:column;gap:0;border-left:1px solid var(--line);margin-left:5px;padding-left:14px}
	.dbtl{position:relative;padding:7px 0;font:500 11px/1.4 var(--sans);color:var(--muted)}
	.dbtl:before{content:'';position:absolute;left:-19px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--line);border:2px solid var(--app-bg)}
	.dbtl.update:before{background:#4ec98a}
	.dbtl b{color:var(--ink2);font-weight:700}
	.dbtl s{text-decoration:none;color:var(--faint);font-size:10px;margin-left:6px}

	/* ── Компактная кнопка: один размер по всему приложению ────────── */
	.mbtn.sm{padding:6px 10px;font:700 11px/1 var(--sans);border-radius:8px;display:inline-flex;align-items:center;gap:5px}
	.mbtn.icon{padding:6px;width:26px;height:26px;justify-content:center}
	.mbtn.sm:hover{border-color:var(--accent);color:var(--ink)}
	.mbtn[disabled]{opacity:.45;cursor:default}
	.mbtn[disabled]:hover{border-color:var(--line);color:var(--ink2)}

	/* ── ИИ-ассистент: чат + боковая колонка чатов ─────────────────── */
	.aishell{display:flex;gap:12px;height:100%;min-height:0;position:relative}
	.aimain{flex:1;min-width:0;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
	.chatside{width:236px;flex-shrink:0;display:flex;flex-direction:column;min-height:0;background:var(--surface2);border:1px solid var(--line);border-radius:14px;overflow:hidden;
		transition:width .24s cubic-bezier(.4,0,.2,1),opacity .18s ease,margin .24s cubic-bezier(.4,0,.2,1),border-color .2s}
	.chatside.hidden{width:0;opacity:0;margin-left:-12px;border-color:transparent;pointer-events:none}
	.chatside > *{min-width:214px}
	.csh{display:flex;align-items:center;gap:7px;padding:10px 11px;border-bottom:1px solid var(--line)}
	.csh b{flex:1;font:800 11px/1 var(--sans);letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
	.cslist{flex:1;overflow-y:auto;padding:7px;display:flex;flex-direction:column;gap:5px}
	.csrow{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 9px;cursor:pointer;color:inherit;transition:all .13s;position:relative}
	.csrow:hover{border-color:var(--accent)}
	.csrow.on{border-color:var(--accent);background:var(--accent-soft)}
	.csrow b{display:block;font:700 11.5px/1.35 var(--sans);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:16px}
	.csrow.on b{color:var(--accent-ink)}
	.csrow i{display:block;font:500 10px/1.3 var(--sans);color:var(--faint);font-style:normal;margin-top:3px}
	.csdel{position:absolute;top:6px;right:6px;border:none;background:transparent;color:var(--faint);cursor:pointer;padding:2px;border-radius:5px;line-height:0;opacity:0;transition:opacity .12s}
	.csrow:hover .csdel{opacity:1}
	.csdel:hover{color:var(--danger)}
	.csft{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:7px}
	.csnote{font:500 10px/1.4 var(--sans);color:var(--faint)}
	.cstoggle{display:flex;align-items:center;gap:8px;font:600 10.5px/1.3 var(--sans);color:var(--ink2);cursor:pointer}
	.cstoggle .sw{flex-shrink:0}
	/* Шапка чата: раньше кнопку показа панели рисовали поверх переписки,
	   и пузыри её перекрывали. Теперь она в потоке и ничего не заслоняет. */
	.aitop{display:flex;align-items:center;gap:6px;padding:0 2px 9px;flex-shrink:0}
	.aitop .nm{flex:1;min-width:0;font:700 11.5px/1.3 var(--sans);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
	.aitop .nm s{text-decoration:none;color:var(--faint);font-weight:600}

	/* ── Ответ ИИ: главное видно за секунду ────────────────────────── */
	.ans{display:flex;flex-direction:column;gap:9px}
	.ans-main{display:flex;align-items:flex-start;gap:9px;background:rgba(78,201,138,.13);border:1px solid rgba(78,201,138,.4);border-radius:12px;padding:11px 13px}
	.ans-main.none{background:rgba(240,178,60,.10);border-color:rgba(240,178,60,.38)}
	.ans-main .bar{width:3px;align-self:stretch;border-radius:2px;background:#4ec98a;flex-shrink:0}
	.ans-main.none .bar{background:#f0b23c}
	.ans-main .tx{font:800 13px/1.4 var(--sans);color:#8fe8b7}
	.ans-main.none .tx{color:#f3c778}
	.ans-art{display:inline-block;background:rgba(78,201,138,.22);color:#adf1cd;border-radius:5px;padding:1px 6px;margin-right:5px;font:800 12.5px/1.5 var(--sans);white-space:nowrap}
	.ans-art.link{cursor:pointer}
	.ans-art.link:hover{background:rgba(78,201,138,.36);color:#fff}
	.ans-art.bad{background:rgba(224,85,78,.18);color:#ffb3ad;text-decoration:line-through;text-decoration-thickness:1px}
	.ans-main.info{background:rgba(124,116,255,.11);border-color:rgba(124,116,255,.38)}
	.ans-main.info .bar{background:var(--accent)}
	.ans-main.info .tx{color:var(--ink);font-weight:700}
	.ans-li{display:flex;gap:8px;font:500 11.5px/1.55 var(--sans);color:var(--ink);padding:0 2px 0 8px}
	.ans-li:before{content:'—';color:var(--accent);font-weight:800;flex-shrink:0}
	.ans-also .k,.ans-off .k{font:800 9px/1.9 var(--sans);letter-spacing:.5px;text-transform:uppercase;color:var(--faint);flex-shrink:0}
	.ans-off{display:flex;align-items:flex-start;gap:8px;font:500 11px/1.5 var(--sans);color:#f3c778;background:rgba(240,178,60,.08);border:1px dashed rgba(240,178,60,.4);border-radius:9px;padding:7px 10px}
	.ans-bad{font:700 11px/1.5 var(--sans);color:#ffb3ad;background:rgba(224,85,78,.10);border:1px solid rgba(224,85,78,.4);border-radius:9px;padding:7px 10px}
	.ans-pun{display:flex;align-items:flex-start;gap:8px;font:700 11.5px/1.5 var(--sans);color:#f0b23c;padding:0 2px}
	.ans-pun .k{font:800 9.5px/1.7 var(--sans);letter-spacing:.5px;text-transform:uppercase;color:var(--faint);flex-shrink:0;padding-top:1px}
	.ans-why{font:500 11.5px/1.6 var(--sans);color:var(--ink2);padding:0 2px}
	.ans-also{display:flex;align-items:flex-start;gap:8px;font:500 11px/1.5 var(--sans);color:var(--muted);background:var(--chip);border-radius:9px;padding:7px 10px}
	.ans-also{flex-wrap:wrap}
	.ans-also > span:last-child{flex:1 1 150px;min-width:0}
	/* разобранный ответ — во всю ширину пузыря: короткий ответ иначе
	   сжимал строку «основание» в столбик по слову */
	.msg.ai .bub:has(> .ans){width:82%}
	.ans-also b{color:var(--accent-ink);font-weight:800;white-space:nowrap}
	.ans-q{display:flex;align-items:flex-start;gap:8px;font:600 11.5px/1.5 var(--sans);color:#9fc7ff;background:rgba(96,150,255,.12);border:1px solid rgba(96,150,255,.32);border-radius:11px;padding:9px 12px}
	.ans-md{font:500 11.5px/1.6 var(--sans);color:var(--ink)}
	.ans-md b{color:var(--ink);font-weight:800}
	.ans-md .h{display:block;font:800 12.5px/1.6 var(--sans);color:var(--accent-ink);margin:8px 0 2px}
	.ans-md .h:first-child{margin-top:0}
	.ans-md .li{display:flex;gap:7px}
	.ans-md .li:before{content:'·';color:var(--faint);font-weight:800}
	:root[data-theme="light"] .ans-main .tx{color:#1a7a4e}
	:root[data-theme="light"] .ans-art{background:rgba(34,160,107,.16);color:#14684a}
	:root[data-theme="light"] .ans-main.none .tx{color:#8a5b06}
	:root[data-theme="light"] .ans-pun{color:#a06a08}

								<ul>
									<li>модель всё время занимает видеопамять — от ~1 до ~4,5 ГБ сверх самой игры;</li>
									<li>после каждой фразы видеокарта загружается рывком, до секунды: возможны просадки FPS;</li>
									<li>без видеокарты NVIDIA распознавание идёт на процессоре — с задержкой в несколько секунд и заметной нагрузкой.</li>
								</ul>
								<p><b>Качество и нагрузку выбираете вы</b> — моделью во вкладке. Чем точнее, тем тяжелее; сменить можно между сценами.</p>
								<div className="bcims">${VMODEL_ORDER.map(function (id) {
									var m = VMODEL[id]
									return html`<div className="bcim" key=${id}><b>${m.label}${id === rec ? ' ★' : ''}</b><span>${m.title}</span><i>${vramText(m)} · скачать ~${m.dl} ГБ</i></div>`
								})}</div>
								<p className="bcinote">${g ? 'Ваша видеокарта: ' + g.name + ', ' + Math.round(g.vramMB / 1024) + ' ГБ. ★ — рекомендуем для неё.' : 'Видеокарта NVIDIA не найдена. ★ — рекомендуем для вашего ПК.'}</p>
							</div>

							<h4>Где может ошибаться</h4>
							<ul>
								<li>Распознавание не идеально: шум, рация, сленг, акцент, тихий микрофон. Фраза может быть понята неверно или не услышана — особенно длинное чтение прав.</li>
								<li>Голоса различаются неточно. Пока роль человека не ясна, он помечен «Неизвестный».</li>
								<li>Приложение знает только то, что услышало: «не прозвучало» значит «не расслышано», а не «вы не сделали».</li>
								<li>ИИ может ошибиться — номер статьи сверяйте с кодексом. Ответы со статьями не из сцены и со ссылками на реальные законы отбрасываются, но проверка не всесильна.</li>
								<li>Порядок задержания читается из кодекса сервера. Где прочитать его не удалось, используется общий порядок — окно об этом скажет.</li>
								<li>Это BETA: возможны сбои. Процедура и ответственность за неё — на офицере. Bodycam подсказывает, но не решает.</li>
							</ul>

							<h4>Что нужно, чтобы работало корректно</h4>
							<ul>
								<li>Windows 11. На Windows 10 звук игры может слушаться вместе со всем звуком ПК.</li>
								<li>Видеокарта NVIDIA, желательно от 6 ГБ видеопамяти.</li>
								<li>Микрофон, и Windows разрешает его программам: Параметры → Конфиденциальность и защита → Микрофон → «Разрешить классическим приложениям доступ к микрофону».</li>
								<li>Игра в режиме «Без рамки» или «В окне»: в полноэкранном режиме окно поверх игры не видно.</li>
								<li>Свободная клавиша этапа. Если её заняла другая программа, вкладка об этом скажет; клавишу можно сменить.</li>
								<li>Интернет — только для первого скачивания модели и для ответов ИИ. Место на диске — 0,5–3 ГБ под модель.</li>
							</ul>

							<h4>Какие права нужны</h4>
							<ul>
								<li><b>Права администратора не нужны.</b></li>
								<li><b>Микрофон</b> — обычное разрешение Windows (см. выше). Пока идёт запись, Windows показывает значок микрофона в трее, а в Protocol горит красная точка.</li>
								<li><b>Звук игры</b> берётся стандартным механизмом Windows для записи звука приложения. Отдельного разрешения он не требует, в игру ничего не внедряется, её файлы не меняются.</li>
								<li><b>Голоса других игроков</b> на звуке игры распознаются только для подсказок в текущей сцене и нигде не сохраняются.</li>
								<li><b>Служба распознавания</b> работает на этом ПК по адресу 127.0.0.1 — из сети она недоступна.</li>
								<li><b>Глобальные клавиши</b> ${dispAccel(hotkeys.stage)}, ${dispAccel(hotkeys.stageBack)} и ${dispAccel(hotkeys.voiceStop)} заняты, пока открыт Protocol.</li>
								<li>В правилах Majestic RP запрета на такие программы нет. Правила меняются — следите за ними.</li>
							</ul>
							<p className="bcinote">Это окно можно открыть снова: «Как устроен Bodycam и что ему нужно» во вкладке.</p>
						</div>
						<div className="modalft"><button className="mbtn" onClick=${function () { setBcIntroOpen(false) }}>Закрыть</button><button className="mbtn pri" onClick=${ackBodycam}>Понятно</button></div>
					</div></div>`
				})() : null}
				${hkOpen ? html`<div className="modalbg" onClick=${function () { setHkOpen(false); setCapture(null) }}><div className="modal" onClick=${function (e) { e.stopPropagation() }}>
					<div className="modalhd">${ic(I.keyboard, 13)}<h3>Горячие клавиши</h3><button className="x" onClick=${function () { setHkOpen(false); setCapture(null) }}>${ic(I.x, 10)}</button></div>
					<div className="modalbody">${HK_ORDER.filter(function (k) { return voiceAvail || !HK_VOICE[k] }).map(function (k) { return html`<div className="hkrow" key=${k}><span className="hkname">${HK_LABEL[k]}</span><button className=${'hkkey' + (capture === k ? ' cap' : '')} onClick=${function () { setCapture(capture === k ? null : k) }}>${capture === k ? 'нажмите клавиши…' : dispAccel(hotkeys[k])}</button></div>` })}</div>
					<div className="modalft"><button className="mbtn" onClick=${function () { setHotkeys(Object.assign({}, HK_DEF)); setCapture(null) }}>Сбросить</button><button className="mbtn pri" onClick=${function () { setHkOpen(false); setCapture(null); toast('Горячие клавиши сохранены') }}>Готово</button></div>
				</div></div>` : null}

				${editsOpen ? html`<div className="modalbg" onClick=${function () { setEditsOpen(false) }}><div className="modal" onClick=${function (e) { e.stopPropagation() }}>
					<div className="modalhd">${ic(I.edit, 13)}<h3>Мои правки (${editCount})</h3><button className="x" onClick=${function () { setEditsOpen(false) }}>${ic(I.x, 10)}</button></div>
					<div className="modalbody">${editCount ? Object.keys(edits).map(function (k) { var e = edits[k]; return html`<div className="diff" key=${k}>
						<div className="dh">${e.short || ''} · Ст. ${e.num}${e.deleted ? ' — удалена' : ''}</div>
						<div className="col before">— ${e.orig ? e.orig.title : ''}</div>
						${e.deleted ? null : html`<div className="col after">+ ${e.title}</div>`}
					</div>` }) : html`<div className="empty"><h2>Правок нет</h2><div>Включи режим разработчика и правь статьи.</div></div>`}</div>
					<div className="modalft"><button className="mbtn" onClick=${function () { setEdits({}) }}>Очистить всё</button><button className="mbtn pri" onClick=${function () { try { navigator.clipboard.writeText(JSON.stringify(edits, null, 2)) } catch (e) {} setUpd('правки скопированы') }}>Скопировать для автора</button></div>
				</div></div>` : null}
			</div>`
		}

		ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`)
	})()
	</script>
</body>
</html>
