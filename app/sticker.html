<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:transparent}
  #card{height:100%;display:flex;flex-direction:column;border:1px solid rgba(124,116,255,.45);border-radius:13px;box-shadow:0 8px 28px rgba(0,0,0,.45);position:relative;transition:border-color .2s,box-shadow .2s}
  #card.nofocus{border-color:rgba(59,130,246,.95);box-shadow:0 8px 28px rgba(0,0,0,.45),inset 0 0 0 1px rgba(59,130,246,.95)}
  /* фон по умолчанию — общий для всех окон поверх игры (как у Bodycam); прозрачность меняется ползунком */
  #bg{position:absolute;inset:0;border-radius:13px;background:#100f1a;opacity:.95;z-index:0}
  #bar{height:28px;flex-shrink:0;display:flex;align-items:center;gap:5px;padding:0 5px 0 10px;-webkit-app-region:drag;border-bottom:1px solid rgba(255,255,255,.08);position:relative;z-index:1}
  #title{-webkit-app-region:no-drag;flex:1;background:transparent;border:none;outline:none;color:#c4bdff;font-size:11.5px;font-weight:800;letter-spacing:.3px;font-family:inherit}
  #title::placeholder{color:#6b6890}
  .btn{-webkit-app-region:no-drag;width:22px;height:22px;border:none;border-radius:7px;cursor:pointer;font-size:11px;line-height:1;background:rgba(255,255,255,.07);color:#c9c6dc;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .btn:hover{background:rgba(124,116,255,.22);color:#fff}
  #close{background:rgba(224,85,78,.16);color:#f2a29d}
  #close:hover{background:#c0392b;color:#fff}
  #body{flex:1;overflow:auto;padding:9px 12px 11px;font-size:12.5px;line-height:1.55;-webkit-app-region:no-drag;position:relative;z-index:1;background:transparent;border:none;outline:none;resize:none;width:100%;color:#ecebf6;font-family:inherit;word-break:break-word}
  #body::placeholder{color:#6b6890}
  #panel{position:relative;z-index:1;display:none;flex-direction:column;gap:7px;padding:8px 11px;border-top:1px solid rgba(255,255,255,.08)}
  #panel.show{display:flex}
  .row{display:flex;align-items:center;gap:8px;-webkit-app-region:no-drag}
  .row label{font-size:10px;color:#9a97b0;min-width:64px}
  #opacity{flex:1}
  .colorbtn{border:1px solid rgba(255,255,255,.16);border-radius:7px;cursor:pointer;font-size:10px;padding:4px 9px;background:rgba(255,255,255,.05);color:#c9c6dc}
  .colorbtn.active{border-color:#7c74ff;color:#c4bdff;background:rgba(124,116,255,.14)}
  ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px}
  input[type=range]{-webkit-appearance:none;height:4px;background:rgba(255,255,255,.2);border-radius:2px;outline:none;-webkit-app-region:no-drag}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#7c74ff;cursor:pointer}
</style>
</head>
<body>
  <div id="card">
    <div id="bg"></div>
    <div id="bar">
      <input id="title" placeholder="Заметка" />
      <button class="btn" id="fav" title="В избранное">☆</button>
      <button class="btn" id="settings" title="Прозрачность и цвет">⚙</button>
      <button class="btn" id="close" title="Закрыть">✕</button>
    </div>
    <textarea id="body" placeholder="Введите текст заметки..."></textarea>
    <div id="panel">
      <div class="row">
        <label>Прозрачность</label>
        <input type="range" id="opacity" min="15" max="100" value="95" />
      </div>
      <div class="row">
        <label>Цвет текста</label>
        <button class="colorbtn active" id="cWhite">⚪ Белый</button>
        <button class="colorbtn" id="cBlack">⚫ Чёрный</button>
      </div>
      <div class="row">
        <label>Размер шрифта</label>
        <button class="colorbtn" id="fMinus" title="Меньше">А−</button>
        <span id="fVal" style="font-size:11px; color:#c9cad4; min-width:34px; text-align:center;">13</span>
        <button class="colorbtn" id="fPlus" title="Больше">А+</button>
      </div>
    </div>
  </div>
  <script>
    var bg = document.getElementById('bg');
    var body = document.getElementById('body');
    var title = document.getElementById('title');
    var panel = document.getElementById('panel');

    var opacityEl = document.getElementById('opacity');
    var white = document.getElementById('cWhite');
    var black = document.getElementById('cBlack');
    var isDark = false;
    var fontSize = 13;                 // размер шрифта тела заметки, px
    var FONT_MIN = 10, FONT_MAX = 26;

    function applyFont(px){
      fontSize = Math.max(FONT_MIN, Math.min(FONT_MAX, px));
      body.style.fontSize = fontSize + 'px';
      var fv = document.getElementById('fVal');
      if (fv) fv.textContent = String(fontSize);
    }

    function applyDark(d){
      isDark = d;
      if (d) { body.style.color='#0d0e14'; title.style.color='#1a1c25';
        black.classList.add('active'); white.classList.remove('active'); }
      else { body.style.color='#e8e9f0'; title.style.color='#c4b5fd';
        white.classList.add('active'); black.classList.remove('active'); }
    }
    function pushUpdate(){
      if (window.stickerAPI) window.stickerAPI.update({
        text: body.value, title: title.value,
        opacity: parseInt(opacityEl.value), dark: isDark, fontSize: fontSize });
    }

    // Приём начального состояния (текст, заголовок, прозрачность, цвет)
    if (window.stickerAPI) {
      window.stickerAPI.onInit(function(d){
        body.value = d.text || '';
        title.value = d.title || '';
        if (typeof d.opacity === 'number') { opacityEl.value = d.opacity; bg.style.opacity = (d.opacity/100).toString(); }
        if (typeof d.dark === 'boolean') applyDark(d.dark);
        applyFont(typeof d.fontSize === 'number' ? d.fontSize : 13);
      });
      document.getElementById('close').onclick = function(){ window.stickerAPI.close(); };
      var fMinus = document.getElementById('fMinus');
      var fPlus = document.getElementById('fPlus');
      if (fMinus) fMinus.onclick = function(){ applyFont(fontSize - 1); pushUpdate(); };
      if (fPlus)  fPlus.onclick  = function(){ applyFont(fontSize + 1); pushUpdate(); };
      // Фокус игры включён/выключен — перекрашиваем рамку
      if (window.stickerAPI.onNoFocus) {
        window.stickerAPI.onNoFocus(function(on){
          document.getElementById('card').classList.toggle('nofocus', !!on);
        });
      }
    }

    // Сохраняем изменения текста и заголовка
    body.addEventListener('input', pushUpdate);
    title.addEventListener('input', pushUpdate);

    // Кнопка «в избранное» — отправляем заголовок и текст заметки в приложение
    var favBtn = document.getElementById('fav');
    favBtn.onclick = function(){
      if (window.stickerAPI && (body.value.trim() || title.value.trim())) {
        window.stickerAPI.favorite({ title: title.value, text: body.value,
          fontSize: fontSize, opacity: parseInt(opacityEl.value), dark: isDark });
        favBtn.textContent = '★';
        favBtn.style.color = '#fbbf24';
        setTimeout(function(){ favBtn.textContent='☆'; favBtn.style.color=''; }, 1500);
      }
    };

    // Настройки прозрачности/цвета
    document.getElementById('settings').onclick = function(){ panel.classList.toggle('show'); };
    opacityEl.oninput = function(e){
      bg.style.opacity = (e.target.value/100).toString();
      pushUpdate();
    };
    white.onclick = function(){ applyDark(false); pushUpdate(); };
    black.onclick = function(){ applyDark(true); pushUpdate(); };
  </script>
</body>
</html>
