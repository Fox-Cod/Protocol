<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'" />
<title>Быстрый ИИ</title>
<!--
  Быстрый ИИ поверх игры (Alt+Q). Переделан 03.11.2026 («кривой и не
  красивый»): было квадратное непрозрачное окно с закруглённой панелью внутри
  (тёмные углы) и фиксированной высотой — ответ уезжал под прокрутку, кнопка
  обрезалась.

  Сейчас окно прозрачное, а высоту подгоняет под содержимое (overlayAPI.fit):
  ответ всегда виден целиком, длиннее 640 px — прокрутка внутри.
  Вид — строка-запрос, как командная палитра; пока пусто — примеры запросов
  (щелчок — спросить); ответ — карточками «статья · суть · наказание», статья —
  кнопка: открыть её в Protocol и проверить (как ссылки Bodycam).
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#eeecf8; --ink2:#c9c5e2; --muted:#8f8bb0; --faint:#625f80;
    --accent:#8b7dff; --ok:#4ee0a0; --warn:#f2b545;
  }
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
  /* Фон и рамка — одним цветом, как у остальных окон поверх игры (Bodycam,
     заметки): без переливов — решение пользователя 03.11.2026 */
  #panel{position:relative;width:100%;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;
    background:rgba(16,15,26,.96);border:1px solid rgba(124,116,255,.45)}

  /* ── строка запроса: тянуть за любое место, кроме поля и кнопок ── */
  #top{-webkit-app-region:drag;position:relative;display:flex;align-items:flex-start;gap:10px;padding:12px 10px 12px 14px}
  #spark{flex:none;width:28px;height:28px;margin-top:1px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:rgba(139,125,255,.18);border:1px solid rgba(139,125,255,.45);font-size:14px;color:#cfc9ff}
  #spark.busy{animation:spin 1.4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #q{-webkit-app-region:no-drag;flex:1;min-width:0;background:none;border:none;outline:none;resize:none;
    color:var(--ink);font:600 15px/1.4 'Inter',system-ui,sans-serif;padding:5px 0 3px;max-height:66px;overflow-y:auto;scrollbar-width:none;-webkit-user-select:text;user-select:text}
  #q::-webkit-scrollbar{display:none}
  #q::placeholder{color:var(--faint);font-weight:500}
  #srv{flex:none;margin-top:5px;font:700 9.5px/1 'Inter',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:999px;padding:4px 8px;white-space:nowrap}
  #srv:empty{display:none}
  #closeBtn{-webkit-app-region:no-drag;flex:none;width:26px;height:26px;border:none;background:none;color:var(--muted);border-radius:8px;cursor:pointer;font-size:13px}
  #closeBtn:hover{background:rgba(255,255,255,.08);color:#fff}

  /* ── тело ── */
  #body{-webkit-app-region:no-drag;border-top:1px solid rgba(255,255,255,.06);padding:12px 14px 4px;overflow-y:auto;max-height:520px}
  #body::-webkit-scrollbar{width:6px} #body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}

  .lead{font:500 11.5px/1.5 'Inter',sans-serif;color:var(--muted);margin-bottom:9px}
  .ex{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .ex button{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);color:var(--ink2);border-radius:999px;
    padding:5px 10px;font:600 11px/1 'Inter',sans-serif;cursor:pointer}
  .ex button:hover{border-color:var(--accent);color:#fff;background:rgba(139,125,255,.14)}

  /* думает: мерцающая заготовка карточки */
  .think{display:flex;flex-direction:column;gap:7px;padding:2px 0 10px}
  .think i{display:block;height:12px;border-radius:6px;background:rgba(255,255,255,.07);animation:blink 1.1s ease-in-out infinite}
  .think i:nth-child(2){animation-delay:.15s} .think i:nth-child(3){animation-delay:.3s}
  .think i:nth-child(1){width:42%;height:20px} .think i:nth-child(2){width:88%} .think i:nth-child(3){width:64%}
  @keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}
  .thinkT{font:500 11px/1.4 'Inter',sans-serif;color:var(--muted);margin-top:2px}

  /* ответ — карточка на деяние */
  .card{position:relative;border-radius:12px;padding:11px 12px 11px 14px;margin-bottom:8px;overflow:hidden;
    background:rgba(78,224,160,.09);border:1px solid rgba(78,224,160,.30);
    animation:rise .22s ease-out both}
  .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ok)}
  .card + .card{animation-delay:.06s}
  @keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .head{display:flex;align-items:flex-start;gap:9px}
  .head .ttl{padding-top:2px}
  .art{-webkit-app-region:no-drag;flex:none;border:1px solid rgba(78,224,160,.55);background:rgba(78,224,160,.16);color:#b8f6da;
    border-radius:8px;padding:4px 9px;font:800 13px/1 ui-monospace,'Cascadia Mono',Consolas,monospace;cursor:pointer;white-space:nowrap}
  .art:hover{background:rgba(78,224,160,.32);color:#fff}
  .ttl{font:800 14px/1.35 'Inter',sans-serif;color:#eafff4;min-width:0}
  .pun{display:flex;gap:7px;align-items:flex-start;margin-top:8px;font:600 12px/1.5 'Inter',sans-serif;color:#f6cf86;-webkit-user-select:text;user-select:text}
  .pun b{flex:none;font:800 8.5px/1.9 'Inter',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);
    border:1px solid rgba(242,181,69,.45);border-radius:4px;padding:0 4px}
  .card.none{background:rgba(242,181,69,.09);border-color:rgba(242,181,69,.35)}
  .card.none::before{background:var(--warn)}
  .card.none .ttl{color:#fde3ae}
  /* ответ-объяснение (определение, порядок, правила) — фиолетовая карточка */
  .card.info{background:rgba(139,125,255,.09);border-color:rgba(139,125,255,.32)}
  .card.info::before{background:var(--accent)}
  .card.info .ttl{font:700 13px/1.45 'Inter',sans-serif;color:var(--ink);-webkit-user-select:text;user-select:text}
  .steps{margin:7px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
  .steps li{display:flex;gap:7px;font:500 12px/1.45 'Inter',sans-serif;color:var(--ink2);-webkit-user-select:text;user-select:text}
  .steps li::before{content:'—';color:var(--accent);font-weight:800;flex:none}
  .base{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font:500 11px/1.4 'Inter',sans-serif;color:var(--muted)}
  .base b{font:800 8.5px/1.9 'Inter',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .card.info .art{border-color:rgba(139,125,255,.5);background:rgba(139,125,255,.16);color:#cfc9ff;font-size:11.5px;padding:3px 7px}
  .card.info .art:hover{background:rgba(139,125,255,.32);color:#fff}
  .off{margin-top:8px;font:500 11px/1.45 'Inter',sans-serif;color:#f6cf86;border:1px dashed rgba(242,181,69,.4);border-radius:8px;padding:5px 8px}
  .off i{font-style:normal;font-weight:800;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;margin-right:5px;color:var(--warn)}
  .art.bad{border-color:rgba(224,85,78,.6);background:rgba(224,85,78,.16);color:#ffb3ad;text-decoration:line-through;cursor:default}
  .badnote{font:700 11px/1.45 'Inter',sans-serif;color:#ffc9c4;margin:0 2px 8px}
  .rest{font:500 11.5px/1.55 'Inter',sans-serif;color:var(--ink2);margin:0 2px 8px;-webkit-user-select:text;user-select:text}
  .err{display:flex;gap:8px;align-items:flex-start;font:600 12px/1.5 'Inter',sans-serif;color:#ffc9c4;
    background:rgba(224,85,78,.12);border:1px solid rgba(224,85,78,.4);border-radius:10px;padding:9px 11px;margin-bottom:8px}

  /* ── подвал: подсказка клавиш, прозрачность, копировать ── */
  #foot{-webkit-app-region:drag;display:flex;align-items:center;gap:10px;padding:7px 12px 9px 14px;font:600 10px/1 'Inter',sans-serif;color:var(--faint)}
  kbd{font:700 9.5px/1 Consolas,monospace;color:var(--ink2);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);border-radius:4px;padding:2px 5px;margin-right:4px}
  .grow{flex:1}
  #copy{-webkit-app-region:no-drag;border:none;background:none;color:var(--muted);font:700 10.5px/1 'Inter',sans-serif;cursor:pointer;padding:4px 6px;border-radius:6px}
  #copy:hover{color:#fff;background:rgba(255,255,255,.07)}
  #copy.hide{display:none}
  input[type=range]{-webkit-app-region:no-drag;-webkit-appearance:none;width:54px;height:3px;background:rgba(255,255,255,.16);border-radius:2px;outline:none;opacity:.55}
  input[type=range]:hover{opacity:1}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--accent);cursor:pointer}
  @media (prefers-reduced-motion:reduce){#spark.busy,.think i,.card{animation:none}}
</style>
</head>
<body>
<div id="panel">
  <div id="top">
    <span id="spark">✦</span>
    <textarea id="q" rows="1" placeholder="Что случилось?"></textarea>
    <span id="srv" title="Ответ — по законам этого сервера"></span>
    <button id="closeBtn" title="Скрыть (Esc)">✕</button>
  </div>
  <div id="body"></div>
  <div id="foot">
    <span id="hintAsk"><kbd>Enter</kbd>спросить</span><span id="hintHide"><kbd>Esc</kbd>скрыть</span>
    <span class="grow"></span>
    <button id="copy" class="hide" title="Скопировать ответ">Копировать</button>
    <input type="range" id="opacity" min="35" max="100" value="95" title="Прозрачность">
  </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', function () {
  var api = window.overlayAPI || {};
  var E = function (id) { return document.getElementById(id); };
  var q = E('q'), body = E('body'), spark = E('spark'), copyBtn = E('copy'), opacity = E('opacity');
  var busy = false, lastAnswer = '';
  var EXAMPLES = ['угон машины', 'напал на сотрудника полиции', 'какой порядок задержания', 'что такое соучастие'];

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  // Высота окна — по содержимому: ответ виден целиком, без прокрутки и обрезанных кнопок
  function fit() {
    requestAnimationFrame(function () {
      var panel = E('panel');
      var h = E('top').offsetHeight + E('foot').offsetHeight + Math.min(body.scrollHeight, 520) + 2;
      if (api.fit) api.fit(Math.ceil(h));
      panel.style.height = '';
    });
  }

  function applyOpacity(v) { if (api.setOpacity) api.setOpacity(v); }
  try { var s = localStorage.getItem('overlay_opacity'); if (s !== null) opacity.value = s; } catch (e) {}
  applyOpacity(parseInt(opacity.value, 10));
  opacity.addEventListener('input', function () {
    applyOpacity(parseInt(opacity.value, 10));
    try { localStorage.setItem('overlay_opacity', opacity.value); } catch (e) {}
  });

  function idle() {
    copyBtn.className = 'hide';
    body.innerHTML = '<div class="lead">Опишите ситуацию своими словами — найду статью и наказание. Можно и спросить: порядок, понятие, правила.</div>'
      + '<div class="ex">' + EXAMPLES.map(function (x) { return '<button data-ex="' + esc(x) + '">' + esc(x) + '</button>'; }).join('') + '</div>';
    fit();
  }
  function thinking() {
    copyBtn.className = 'hide';
    body.innerHTML = '<div class="think"><i></i><i></i><i></i><div class="thinkT">Ищу статью по базе сервера…</div></div>';
    spark.className = 'busy';
    fit();
  }
  function error(t) {
    spark.className = '';
    copyBtn.className = 'hide';
    body.innerHTML = '<div class="err">⚠ ' + esc(t) + '</div>';
    fit();
  }

  // Автовысота поля: длинный вопрос — до трёх строк
  function grow() { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 66) + 'px'; fit(); }
  q.addEventListener('input', grow);

  function focusBack() { try { return localStorage.getItem('lumenFocusBack') !== '0'; } catch (e) { return true; } }
  // фокус в игре: подсказки внизу — про то, как спросить снова
  // (подсказка — только когда фокус и правда ушёл: главный процесс отвечает ai-overlay-away)
  function away(on, key) {
    E('hintAsk').innerHTML = on ? (key ? '<kbd>' + esc(key) + '</kbd>' : '') + 'новый вопрос — или щелчок в поле' : '<kbd>Enter</kbd>спросить';
    E('hintHide').innerHTML = on ? '<kbd>✕</kbd>скрыть' : '<kbd>Esc</kbd>скрыть';
  }
  // щелчок в поле, когда фокус в игре, — окно снова принимает ввод
  q.addEventListener('mousedown', function () { if (api.wantFocus) api.wantFocus(); });
  window.addEventListener('focus', function () { away(false); });
  if (api.onAway) api.onAway(function (key) { away(true, key); });
  function resetForInput() {
    q.value = ''; grow();
    busy = false; spark.className = '';
    if (window._askTimer) { clearTimeout(window._askTimer); window._askTimer = null; }
    idle();
    setTimeout(function () { q.focus(); }, 30);
  }
  if (api.onFocus) api.onFocus(resetForInput);
  idle();
  setTimeout(function () { q.focus(); }, 60);

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && api.hide) api.hide(); });
  E('closeBtn').addEventListener('click', function () { if (api.hide) api.hide(); });
  q.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

  body.addEventListener('click', function (e) {
    var ex = e.target.closest('[data-ex]');
    if (ex) { q.value = ex.getAttribute('data-ex'); grow(); send(); return; }
    // статья — открыть её в Protocol и проверить своими глазами
    var art = e.target.closest('[data-ref]');
    if (art && api.openRef) api.openRef(art.getAttribute('data-ref'));
  });

  copyBtn.addEventListener('click', function () {
    navigator.clipboard.writeText(lastAnswer).then(function () {
      copyBtn.textContent = 'Скопировано ✓';
      setTimeout(function () { copyBtn.textContent = 'Копировать'; }, 1500);
    }).catch(function () {});
  });

  // Ответ приходит строками с метками (ai_prompts.js, режим overlay):
  //   ситуация  — «ГЛАВНОЕ: УК ст. 10.5 — суть», «НАКАЗАНИЕ: …», до двух блоков;
  //   остальное — «ОТВЕТ: …», шаги «— …», «ОСНОВАНИЕ: ПК ст. 17 — …»,
  //               «ВНЕ БАЗЫ: …», если ответ не из законов сервера.
  // Каждое ГЛАВНОЕ и ОТВЕТ — своя карточка, остальное ложится в последнюю.
  // r.bad — номера, которых в базе сервера нет (сверка в ProtocolAI.ask):
  // такие зачёркнуты и не открываются — применять их не глядя нельзя.
  var REF = /^([А-ЯЁA-Zа-яёa-z]{1,6})\s*(?:ст\.?|п\.?)\s*([\d.]+)\s*[—–-]?\s*(.*)$/;
  function artBtn(code, num, bad) {
    var ref = code + ' ст.' + num;
    return bad
      ? '<span class="art bad" title="Такой статьи в базе сервера нет — проверьте номер">' + esc(code + ' ' + num) + '</span>'
      : '<button class="art" data-ref="' + esc(ref) + '" title="Открыть статью в Protocol">' + esc(code + ' ' + num) + '</button>';
  }
  function showResult(r) {
    busy = false; spark.className = '';
    if (window._askTimer) { clearTimeout(window._askTimer); window._askTimer = null; }
    if (r && r.server) E('srv').textContent = r.server;
    if (!r) return error('Нет ответа.');
    if (r.error) return error(r.error);
    var out = String(r.text || '').trim();
    if (!out) return error('Пустой ответ — переформулируйте.');
    lastAnswer = out;
    var bad = {};
    (r.bad || []).forEach(function (x) { bad[String(x).toUpperCase()] = 1; });
    var cards = [], rest = [];
    function last() { return cards[cards.length - 1]; }
    out.split(/\r?\n/).forEach(function (line) {
      var mm = line.match(/^\s*(ГЛАВНОЕ|НАКАЗАНИЕ|ОТВЕТ|ОСНОВАНИЕ|ВНЕ БАЗЫ)\s*:\s*(.*)$/i);
      var li = line.match(/^\s*(?:[—–-]|\d{1,2}[.)])\s+(.*)$/);
      if (!mm) {
        if (li && last()) (last().steps = last().steps || []).push(li[1].trim());
        else if (line.trim()) rest.push(line.trim());
        return;
      }
      var k = mm[1].toUpperCase(), v = mm[2].trim();
      if (k === 'НАКАЗАНИЕ') { if (last()) last().pun = v; else rest.push(v); return; }
      if (k === 'ОТВЕТ') { cards.push({ info: true, title: v.replace(/^ВНЕ БАЗЫ:\s*/i, '') }); return; }
      if (k === 'ОСНОВАНИЕ' || k === 'ВНЕ БАЗЫ') {
        if (!last()) cards.push({ info: true, title: '' });
        if (k === 'ВНЕ БАЗЫ') last().off = v;
        else v.split(/;\s*/).forEach(function (p) {
          var a = p.match(REF);
          (last().base = last().base || []).push(a ? { code: a[1].toUpperCase(), num: a[2].replace(/\.$/, ''), t: a[3] } : { t: p });
        });
        return;
      }
      var none = /(нет|не наш|не найд|отсутств)/i.test(v) && !/ст\.?\s*\d/i.test(v);
      var a = v.match(REF);
      cards.push(a && !none ? { code: a[1].toUpperCase(), num: a[2].replace(/\.$/, ''), title: a[3] } : { none: true, title: v });
    });
    var htm = cards.map(function (c) {
      var tail = (c.steps ? '<ul class="steps">' + c.steps.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '')
        + (c.base ? '<div class="base"><b>основание</b>' + c.base.map(function (b) {
          return b.code ? artBtn(b.code, b.num, bad[b.code + ' ' + b.num]) + (c.base.length === 1 && b.t ? '<span>' + esc(b.t) + '</span>' : '') : '<span>' + esc(b.t) + '</span>';
        }).join('') + '</div>' : '')
        + (c.off ? '<div class="off"><i>не из законов сервера</i>' + esc(c.off) + '</div>' : '');
      if (c.info) return '<div class="card info">' + (c.title ? '<div class="ttl">' + esc(c.title) + '</div>' : '') + tail + '</div>';
      if (c.none) return '<div class="card none"><div class="ttl">' + esc(c.title) + '</div>' + tail + '</div>';
      return '<div class="card"><div class="head">' + artBtn(c.code, c.num, bad[c.code + ' ' + c.num])
        + '<div class="ttl">' + esc(c.title) + '</div></div>'
        + (c.pun ? '<div class="pun"><b>наказание</b><span>' + esc(c.pun) + '</span></div>' : '') + tail + '</div>';
    }).join('');
    if (!htm) htm = '<div class="rest">' + esc(out).replace(/\n/g, '<br>') + '</div>';
    else if (rest.length) htm += '<div class="rest">' + rest.map(esc).join('<br>') + '</div>';
    if (r.bad && r.bad.length) htm += '<div class="badnote">⚠ В базе сервера нет: ' + esc(r.bad.join(', ')) + '. Проверьте номер.</div>';
    body.innerHTML = htm;
    copyBtn.className = '';
    fit();
  }
  if (api.onAskResult) api.onAskResult(showResult);

  function send() {
    var text = q.value.trim();
    if (!text || busy) return;
    busy = true;
    thinking();
    if (api.ask) {
      api.ask(text);
      // Фокус — обратно в игру, ответ останется на экране: игра без фокуса
      // глушит звук, и ждать ответ, сидя в окне Protocol, — сидеть без звука.
      // Выключается в настройках («Возвращать фокус в игру»). Новый вопрос —
      // снова Alt+Q или щелчок в поле.
      if (focusBack() && api.returnFocus) api.returnFocus();
      // Ответа нет за 70 с — говорим, а не висим вечно. Сам путь запроса
      // укладывается в минуту (план 6 с, ответ 25 с, исправление номеров
      // 25 с) и о своих сбоях сообщает сам; сюда доходит, только если
      // Protocol не ответил вовсе.
      if (window._askTimer) clearTimeout(window._askTimer);
      window._askTimer = setTimeout(function () {
        if (busy) { busy = false; error('Protocol не ответил. Проверьте, что приложение запущено, и спросите ещё раз.'); }
      }, 70000);
    } else {
      busy = false;
      error('Нет связи с приложением.');
    }
  }
});
</script>
</body>
